<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAPIN — Rede de Apoio Pedagógico e Inclusão Neuroeducacional</title>
  <meta name="description" content="Plataforma de auxílio ao estudo com foco em inclusão e acessibilidade para dislexia, TDAH, deficiência visual, auditiva, autismo e deficiência intelectual.">
  <meta name="theme-color" content="#0D0F1A">


  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#page-content">Pular para o conteúdo principal</a>

<!-- ── Região live para anúncios de leitores de tela ── -->
<div id="sr-announcer" role="alert" aria-live="assertive" aria-atomic="true" class="sr-only"></div>

<!-- ── Toast ── -->
<div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- ── Spinner global ── -->
<div id="global-spinner" class="global-spinner hidden" aria-hidden="true" aria-label="Carregando…">
  <div class="spinner-ring"></div>
</div>

<!-- ── Barra de Acessibilidade ── -->
<header role="banner">
  <nav id="a11y-bar" class="a11y-bar" aria-label="Ferramentas de acessibilidade">
    <!-- preenchida pelo a11y.js -->
  </nav>
</header>

<!-- ════════════════════════════════════════════════════
     TELA DE LOGIN
════════════════════════════════════════════════════ -->
<div id="login-screen" class="login-screen" role="main" aria-label="Tela de acesso">
  <!-- preenchida pelo app.js -->
</div>

<!-- ════════════════════════════════════════════════════
     APP PRINCIPAL (após login)
════════════════════════════════════════════════════ -->
<div id="app-container" class="app hidden" aria-hidden="false">
  <div class="app-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="main-sidebar" aria-label="Menu de navegação">
      <!-- Header da sidebar -->
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i class="fas fa-graduation-cap" aria-hidden="true"></i>
          <span>RAPIN</span>
        </div>
        <button class="sidebar-toggle" id="sidebar-collapse-btn"
          aria-label="Recolher menu" title="Recolher menu">
          <i class="fas fa-chevron-left" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Info do usuário -->
      <div class="sidebar-user" aria-label="Informações do usuário">
        <div class="sidebar-avatar" id="sidebar-avatar" aria-hidden="true">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Usuário</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Aluno</div>
          <div class="sidebar-user-points" id="sidebar-user-points">0 XP · Nível 1</div>
        </div>
      </div>

      <!-- Navegação principal -->
      <nav class="sidebar-nav" aria-label="Navegação principal">
        <div class="nav-section-label" aria-hidden="true">Principal</div>

        <button class="nav-item active" data-page="home"
          aria-label="Início" role="button">
          <i class="fas fa-home" aria-hidden="true"></i>
          <span class="nav-label">Início</span>
          <span class="nav-item-tooltip" aria-hidden="true">Início</span>
        </button>

        <button class="nav-item" data-page="materials"
          aria-label="Materiais de estudo" role="button">
          <i class="fas fa-book-open" aria-hidden="true"></i>
          <span class="nav-label">Materiais</span>
          <span class="nav-item-tooltip" aria-hidden="true">Materiais</span>
        </button>

        <button class="nav-item" data-page="missions"
          aria-label="Missões e desafios" role="button">
          <i class="fas fa-tasks" aria-hidden="true"></i>
          <span class="nav-label">Missões</span>
          <span class="nav-badge" aria-label="4 missões disponíveis">4</span>
          <span class="nav-item-tooltip" aria-hidden="true">Missões</span>
        </button>

        <div class="nav-section-label" aria-hidden="true">Progresso</div>

        <button class="nav-item" data-page="ranking"
          aria-label="Ranking de pontos" role="button">
          <i class="fas fa-trophy" aria-hidden="true"></i>
          <span class="nav-label">Ranking</span>
          <span class="nav-item-tooltip" aria-hidden="true">Ranking</span>
        </button>

        <button class="nav-item" data-page="profile"
          aria-label="Meu perfil e acessibilidade" role="button">
          <i class="fas fa-user-circle" aria-hidden="true"></i>
          <span class="nav-label">Perfil</span>
          <span class="nav-item-tooltip" aria-hidden="true">Perfil</span>
        </button>

        <div class="nav-section-label" aria-hidden="true">Acessibilidade</div>
        <button class="nav-item" onclick="A11y.openPanel()"
          aria-label="Abrir painel de acessibilidade" role="button">
          <i class="fas fa-universal-access" aria-hidden="true"></i>
          <span class="nav-label">Acessibilidade</span>
          <span class="nav-item-tooltip" aria-hidden="true">Acessibilidade</span>
        </button>
      </nav>

      <!-- Barra de nível -->
      <div class="sidebar-footer">
        <div class="sidebar-level" aria-label="Progresso de nível">
          <i class="fas fa-star" style="color:var(--gold);" aria-hidden="true"></i>
          <div class="level-bar" role="progressbar" aria-label="Progresso do nível">
            <div class="level-fill" id="sidebar-level-fill" style="width:0%"></div>
          </div>
        </div>
        <button class="btn-logout" id="btn-logout" aria-label="Sair da plataforma">
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <!-- ── Conteúdo principal ── -->
    <div class="main-content">
      <!-- Header da página -->
      <header class="page-header" role="banner">
        <div style="display:flex;align-items:center;gap:.75rem;">
          <!-- Botão mobile (visível via CSS apenas em ≤960px) -->
          <button id="sidebar-mobile-toggle" class="sidebar-toggle sidebar-mobile-toggle"
            aria-label="Abrir menu" aria-expanded="false"
            aria-controls="main-sidebar">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <div>
            <h1 id="page-title" aria-live="polite">Início</h1>
            <p id="page-subtitle" class="text-muted text-sm" aria-live="polite">Bem-vindo à plataforma</p>
          </div>
        </div>
      </header>

      <!-- Conteúdo da página (SPA) -->
      <main id="page-content" class="page-body" role="main" tabindex="-1"
        aria-label="Conteúdo da página">
        <!-- preenchido dinamicamente pelo app.js -->
        <div class="empty-state">
          <i class="fas fa-graduation-cap" aria-hidden="true"></i>
          <h3>Carregando…</h3>
        </div>
      </main>
    </div>
  </div>
  <!-- ── Overlay fora do flex container (position:fixed não importa, mas estruturalmente correto) ── -->
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
</div>

<!-- ── Scripts ── -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/a11y.js"></script>
<script src="js/app.js"></script>

<!-- Sidebar mobile toggle controlado via CSS media query (css/style.css) -->
</body>
</html>
