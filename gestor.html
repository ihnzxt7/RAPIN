<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAPIN — Painel do Gestor</title>
  <meta name="description" content="Painel de gestão de alunos, professores e materiais — RAPIN">
  <meta name="theme-color" content="#0D0F1A">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/gestor.css">
</head>
<body>
<a class="skip-link" href="#gestor-page-content">Pular para o conteúdo principal</a>

<!-- SR announcer -->
<div id="sr-announcer" role="alert" aria-live="assertive" aria-atomic="true" class="sr-only"></div>

<!-- Toast -->
<div id="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Spinner -->
<div id="global-spinner" class="global-spinner hidden" aria-hidden="true" aria-label="Carregando…">
  <div class="spinner-ring"></div>
</div>

<!-- Barra de Acessibilidade -->
<header role="banner">
  <nav id="a11y-bar" class="a11y-bar" aria-label="Ferramentas de acessibilidade">
    <!-- preenchida pelo a11y.js -->
  </nav>
</header>

<!-- ════════════════════════════════════════
     LOGIN DO GESTOR
════════════════════════════════════════ -->
<div id="gestor-login" class="gestor-login" role="main" aria-label="Login do gestor">
  <!-- preenchido pelo gestor.js -->
</div>

<!-- ════════════════════════════════════════
     PAINEL DO GESTOR
════════════════════════════════════════ -->
<div id="gestor-app" class="gestor-app hidden">
  <div class="gestor-layout">

    <!-- ── Sidebar ── -->
    <aside class="gestor-sidebar" id="gestor-sidebar-el" aria-label="Menu do gestor">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i class="fas fa-shield-alt" aria-hidden="true"></i>
          <span>Gestor</span>
        </div>
        <button class="sidebar-toggle" id="gestor-mobile-toggle"
          aria-label="Abrir/fechar menu" style="cursor:pointer;">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Info do gestor -->
      <div class="sidebar-user" aria-label="Informações do gestor">
        <div class="sidebar-avatar" id="gestor-avatar"
          style="background:var(--gold);color:#1a1a1a;" aria-hidden="true">G</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="gestor-user-name">Gestor</div>
          <div class="sidebar-user-role" id="gestor-user-role">Gestor Escolar</div>
        </div>
      </div>

      <!-- Nav -->
      <nav class="sidebar-nav" aria-label="Navegação do painel do gestor">
        <div class="nav-section-label" aria-hidden="true">Dashboard</div>

        <button class="nav-item active" data-page="dashboard"
          aria-label="Dashboard principal" role="button">
          <i class="fas fa-tachometer-alt" aria-hidden="true"></i>
          <span class="nav-label">Dashboard</span>
          <span class="nav-item-tooltip" aria-hidden="true">Dashboard</span>
        </button>

        <div class="nav-section-label" aria-hidden="true">Gestão</div>

        <button class="nav-item" data-page="students"
          aria-label="Gerenciar alunos" role="button">
          <i class="fas fa-user-graduate" aria-hidden="true"></i>
          <span class="nav-label">Alunos</span>
          <span class="nav-item-tooltip" aria-hidden="true">Alunos</span>
        </button>

        <button class="nav-item" data-page="teachers"
          aria-label="Gerenciar professores" role="button">
          <i class="fas fa-chalkboard-teacher" aria-hidden="true"></i>
          <span class="nav-label">Professores</span>
          <span class="nav-item-tooltip" aria-hidden="true">Professores</span>
        </button>

        <button class="nav-item" data-page="materials"
          aria-label="Gerenciar materiais didáticos" role="button">
          <i class="fas fa-book" aria-hidden="true"></i>
          <span class="nav-label">Materiais</span>
          <span class="nav-item-tooltip" aria-hidden="true">Materiais</span>
        </button>

        <div class="nav-section-label" aria-hidden="true">Relatórios</div>

        <button class="nav-item" data-page="progress"
          aria-label="Relatório de progresso dos alunos" role="button">
          <i class="fas fa-chart-bar" aria-hidden="true"></i>
          <span class="nav-label">Progresso</span>
          <span class="nav-item-tooltip" aria-hidden="true">Progresso</span>
        </button>

        <div class="nav-section-label" aria-hidden="true">Sistema</div>

        <button class="nav-item" data-page="settings"
          aria-label="Configurações do sistema" role="button">
          <i class="fas fa-cog" aria-hidden="true"></i>
          <span class="nav-label">Configurações</span>
          <span class="nav-item-tooltip" aria-hidden="true">Configurações</span>
        </button>

        <button class="nav-item" onclick="A11y.openPanel()"
          aria-label="Abrir painel de acessibilidade" role="button">
          <i class="fas fa-universal-access" aria-hidden="true"></i>
          <span class="nav-label">Acessibilidade</span>
          <span class="nav-item-tooltip" aria-hidden="true">Acessibilidade</span>
        </button>
      </nav>

      <!-- Footer sidebar -->
      <div class="sidebar-footer">
        <a href="index.html" class="btn-logout" style="text-decoration:none;display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;"
          aria-label="Ir para área do aluno">
          <i class="fas fa-external-link-alt" aria-hidden="true"></i>
          <span>Área do Aluno</span>
        </a>
        <button class="btn-logout" id="gestor-logout-btn" aria-label="Sair do painel do gestor">
          <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
          <span>Sair</span>
        </button>
      </div>
    </aside>

    <!-- ── Overlay para fechar sidebar no mobile ── -->
    <div class="sidebar-overlay" id="gestor-sidebar-overlay" aria-hidden="true"></div>

    <!-- ── Main ── -->
    <div class="gestor-main">
      <!-- Topbar -->
      <header class="gestor-topbar" aria-label="Cabeçalho do painel">
        <div style="display:flex;align-items:center;gap:.75rem;">
          <!-- Botão hambúrguer mobile -->
          <button id="gestor-mobile-open" class="sidebar-toggle sidebar-mobile-toggle"
            aria-label="Abrir menu" aria-expanded="false"
            aria-controls="gestor-sidebar-el">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <div>
            <h1 id="gestor-page-title" style="font-size:1.15rem;font-weight:700;" aria-live="polite">Dashboard</h1>
            <div id="gestor-page-sub" class="text-sm text-muted" aria-live="polite">Visão geral da plataforma</div>
          </div>
        </div>
        <div class="gestor-topbar-actions">
          <button class="btn btn-sm btn-secondary" onclick="A11y.openPanel()"
            aria-label="Configurações de acessibilidade">
            <i class="fas fa-universal-access" aria-hidden="true"></i>
          </button>
          <button class="btn btn-sm btn-primary" onclick="GPages.openCreateUser('aluno')"
            aria-label="Adicionar novo aluno">
            <i class="fas fa-plus" aria-hidden="true"></i>
            <span>Novo Aluno</span>
          </button>
        </div>
      </header>

      <!-- Conteúdo -->
      <main id="gestor-page-content" class="gestor-content" role="main"
        tabindex="-1" aria-label="Conteúdo do painel do gestor">
        <div class="empty-state">
          <i class="fas fa-graduation-cap" aria-hidden="true"></i>
          <h3>Carregando…</h3>
        </div>
      </main>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/a11y.js"></script>
<script src="js/gestor.js"></script>
</body>
</html>
